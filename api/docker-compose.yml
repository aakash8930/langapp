# Pins the compose project name. Without this, compose derives it from the
# containing directory — moving this file to api/ would make the project "api",
# which namespaces volumes as api_mongo-data and leaves the real data orphaned in
# langapp_mongo-data. The dev database would silently come up empty.
# Do not remove or rename this.
name: langapp

services:
  mongo:
    image: mongo:7
    container_name: langapp-mongo
    restart: unless-stopped
    ports:
      # 27018 on the host: this machine already runs a system mongod on 27017.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    container_name: langapp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
